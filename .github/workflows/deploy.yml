name: Publicar documentos legales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor Markdown
        run: python -m pip install 'mistune==3.1.3'
      - name: Comprobar datos legales y generar sitio
        run: python scripts/build.py --strict
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
